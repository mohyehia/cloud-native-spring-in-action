services:
  catalog-service:
    depends_on:
      - postgres-db
      - fluent-bit
      - otel-lgtm
    container_name: catalog-service
    image: catalog-service
    ports:
      - '9091:9091'
    environment:
      BPL_JVM_THREAD_COUNT: 50
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/catalog_service
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-lgtm:4318/v1/traces
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/workshop
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: docker.{{.Name}}

  postgres-db:
    container_name: postgres-ctr
    image: postgres:18.1
    restart: unless-stopped
    ports:
      - '5432:5432'
    volumes:
      - ./docker/volumes/postgres:/var/lib/postgresql
    environment:
      POSTGRES_USER: catalog_service
      POSTGRES_PASSWORD: P@ssw0rd
      POSTGRES_DB: catalog_service

  order-service:
    depends_on:
      - mongo-db
      - fluent-bit
      - otel-lgtm
    container_name: order-service
    image: order-service
    ports:
      - '9092:9092'
    environment:
      BPL_JVM_THREAD_COUNT: 50
      SPRING_MONGODB_URI: mongodb://mongo-db:27017/order_service
      CATALOG-SERVICE_URL: http://catalog-service:9091/books
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-lgtm:4318/v1/traces
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/workshop
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: docker.{{.Name}}

  mongo-db:
    container_name: mongo-ctr
    image: mongo:4.4.29-focal
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - ./docker/volumes/mongo:/data/db

  dispatcher-service:
    depends_on:
      - rabbitmq
      - fluent-bit
      - otel-lgtm
    container_name: dispatcher-service
    image: dispatcher-service
    restart: unless-stopped
    ports:
      - '9003:9003'
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-lgtm:4318/v1/traces
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: docker.{{.Name}}

  api-gateway:
    depends_on:
      - redis
      - fluent-bit
      - otel-lgtm
      - keycloak
    container_name: api-gateway
    image: api-gateway
    restart: unless-stopped
    ports:
      - '9001:9001'
    environment:
      CATALOG_SERVICE_URL: http://catalog-service:9091
      ORDER_SERVICE_URL: http://order-service:9092
      SPRING_DATA_REDIS_HOST: redis
      BPL_JVM_THREAD_COUNT: 50
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-lgtm:4318/v1/traces
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/workshop
      SPA_URL: http://polar-ui:9004
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: docker.{{.Name}}

  redis:
    container_name: redis-ctr
    image: redis:latest
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ./docker/volumes/redis:/data

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3.12-management
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
    ports:
      - '5672:5672'
      - '15672:15672'
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.5.4
    command:
      - 'start-dev'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
    ports:
      - '8080:8080'
    volumes:
      - ./docker/volumes/keycloak_data:/opt/keycloak/data

  polar-ui:
    container_name: polar-ui
    image: "ghcr.io/polarbookshop/polar-ui:v1"
    ports:
      - '9004:9004'
    environment:
      PORT: 9004

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: otel-lgtm
    restart: unless-stopped
    ports:
      - "3000:3000"     # Grafana
      - "9090:9090"     # Prometheus
      - "3100:3100"     # Loki
      - "3200:3200"     # Tempo
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "8888:8888"     # OTel Collector Metrics
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Crucial: Enables Prometheus to receive metrics from Tempo
      - PROMETHEUS_ARGS=--web.enable-remote-write-receiver --enable-feature=exemplar-storage
      - OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION=explicit_bucket_histogram
    volumes:
      # Grafana provisioning
      - ./docker/volumes-otel/grafana/dashboards/dashboards-provisioning.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      - ./docker/volumes-otel/grafana/dashboards/:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/
      # Service configs
      - ./docker/volumes-otel/prometheus/prometheus.yml:/otel-lgtm/prometheus.yaml
      # Data persistence
      - otel-lgtm-data:/var/lib/grafana
      - otel-lgtm-prom:/data/prometheus
      - otel-lgtm-loki:/loki

  fluent-bit:
    image: grafana/fluent-bit-plugin-loki:3.5.12
    container_name: fluent-bit
    restart: unless-stopped
    ports:
      - '24224:24224'
    volumes:
      - ./docker/volumes-otel/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
    environment:
      # Use the container name of the merged stack
      LOKI_URL: http://otel-lgtm:3100/loki/api/v1/push

volumes:
  otel-lgtm-data:
  otel-lgtm-prom:
  otel-lgtm-loki: