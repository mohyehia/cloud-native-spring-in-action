apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workshop-keycloak-ingress
  namespace: dev
  labels:
    app: workshop-keycloak
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
    rules:
        - host: workshop.keycloak
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: workshop-keycloak
                    port:
                      number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: workshop-keycloak
  namespace: dev
spec:
  selector:
    app: workshop-keycloak
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-keycloak
  namespace: dev
  labels:
    app: workshop-keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workshop-keycloak
  template:
    metadata:
      name: workshop-keycloak
      labels:
        app: workshop-keycloak
    spec:
      containers:
        - name: workshop-keycloak
          image: quay.io/keycloak/keycloak:26.5.4
          imagePullPolicy: IfNotPresent
          args:
            - 'start-dev'
            - '--import-realm'
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/started
              port: 9000
            periodSeconds: 10
            failureThreshold: 400
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              memory: "750Mi"
              cpu: "500m"
            requests:
              memory: "350Mi"
              cpu: "100m"
          volumeMounts:
            - mountPath: /opt/keycloak/data/import
              name: keycloak-config
              readOnly: true
            - mountPath: /opt/keycloak/data
              name: keycloak-data
      restartPolicy: Always
      volumes:
        - name: keycloak-config
          configMap:
            name: keycloak-config
        - name: keycloak-data
          persistentVolumeClaim:
            claimName: keycloak-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: keycloak-data
    namespace: dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi



# The accessModes field in the PersistentVolumeClaim (PVC) determines how many pods can access the volume and in what way:
# ReadWriteOnce (RWO):
#  The volume can be mounted as read-write by a single pod at a time.
#  (Most common for databases and stateful apps.)
# ReadOnlyMany (ROX):
#  The volume can be mounted as read-only by many pods at the same time.
# ReadWriteMany (RWX):
#  The volume can be mounted as read-write by many pods at the same time.
#  (Requires a storage backend that supports RWX, like NFS, GlusterFS, or cloud file shares.)