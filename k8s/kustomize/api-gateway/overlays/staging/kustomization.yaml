apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging

resources:
  - ../../base

configMapGenerator:
  - name: api-gateway-config
    behavior: merge
    files:
      - application-staging.yaml

images:
  - name: api-gateway
    newName: api-gateway
    newTag: latest

patches:
  - path: patch-env-staging.yaml
    target:
      kind: Deployment
      name: api-gateway
  - path: staging-ingress-patch.yaml
    target:
        kind: Ingress
        name: api-gateway-ingress
