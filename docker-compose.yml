  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    extra_hosts:
      - host.docker.internal:host-gateway
    command:
      - --config.file=/etc/prometheus/prometheus.yml
#      - --web.enable-remote-write-receiver
    volumes:
      - ./docker/volumes/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
  #      - ./docker/volumes/prometheus/alerting-rules.yml:/etc/prometheus/alerting-rules.yml


# sudo chown -R 472:472 ./grafana_data to give grafana user permissions to read/write the data
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - loki
      - tempo
      - prometheus
    ports:
      - '3000:3000'
    user: "472"
    volumes:
      - ./docker/volumes/grafana/datasources/:/etc/grafana/provisioning/datasources/
      - ./docker/volumes/grafana/dashboards/:/etc/grafana/provisioning/dashboards/
      - ./docker/volumes/grafana/grafana.ini:/etc/grafana/grafana.ini
#      - ./docker/volumes/grafana/data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

  fluent-bit:
    image: grafana/fluent-bit-plugin-loki:3.5.12
    container_name: fluent-bit
    restart: unless-stopped
    ports:
      - '24224:24224'
    volumes:
      - ./docker/volumes/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
    environment:
      LOKI_URL: http://loki:3100/loki/api/v1/push

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - '3100:3100'
    depends_on:
      - fluent-bit

  tempo:
    image: grafana/tempo:2.3.0
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yml" ]
    ports:
      - '3200:3200'   # tempo
      - '9411:9411'  # zipkin
      - '4317:4317'  # OTLP gRPC
      - '4318:4318'  # OTLP HTTP
    volumes:
      - ./docker/volumes/tempo-config/tempo.yml:/etc/tempo.yml