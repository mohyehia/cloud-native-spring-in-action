spring:
  application:
    name: catalog-service

  datasource:
    username: catalog_service
    password: P@ssw0rd
    url: jdbc:postgresql://localhost:5432/catalog_service
    hikari:
      connection-timeout: 2000
      maximum-pool-size: 5

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/workshop}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: always
    heapdump:
      access: read_only
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, flyway, heapdump, threaddump
#  otlp:
#    metrics:
#      export:
#        url: http://${OTEL_LGTM:localhost}:4318/v1/metrics
#  opentelemetry:
#    tracing:
#      export:
#        otlp:
#          endpoint: http://${OTEL_LGTM:localhost}:4318/v1/traces
#    logging:
#      export:
#        otlp:
#          endpoint: http://${OTEL_LGTM:localhost}:4318/v1/logs
  tracing:
    sampling:
      probability: 1.0

  metrics:
    tags:
        application: ${spring.application.name}

  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true


server:
  port: 9091
  tomcat:
    connection-timeout: 2s
    keep-alive-timeout: 15s
    threads:
      max: 50
      min-spare: 5
