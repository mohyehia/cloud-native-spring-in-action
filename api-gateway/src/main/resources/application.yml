spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://localhost:9091}/books
              predicates:
                - Path=/books/**
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:9092}/orders
              predicates:
                - Path=/orders/**
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
            pool:
              type: elastic
              max-idle-time: 15s
              max-life-time: 60s
          default-filters:
            - name: Retry
              args:
                retries: 3
                methods: GET
                series: SERVER_ERROR
                exceptions:
                  - java.io.IOException
                  - java.util.concurrent.TimeoutException
                backoff:
                  first-backoff: 50ms
                  max-backoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

server:
  port: 9000
  netty:
    connection-timeout: 2s
    idle-timeout: 15s