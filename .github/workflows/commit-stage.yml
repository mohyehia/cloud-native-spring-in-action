name: Commit Stage
on:
  push:
    branches:
      - main
    paths:
      - catalog-service/**
      - .github/workflows/*.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mohyehia/catalog-service
  VERSION: latest

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Code vulnerability scanning
        uses: anchore/scan-action@v6
        id: scan
        with:
          path: "./catalog-service"
          fail-build: false
          severity-cutoff: 'high'
          output-file: "${{ github.event.repository.name }}-vulnerability-report.json"
      - name:  Upload vulnerability report
        uses:  github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
      - name:  Build, unit tests and integration tests
        run:
          |
          cd catalog-service
          chmod +x ./gradlew
          ./gradlew build
      - name: Validate Kubernetes manifests
        uses: azure/k8s-lint@v3
        with:
          manifests: |
            catalog-service/k8s/base/catalog-service.yaml
          kubeconformOpts: -summary
      - name: Kustomize Build
        uses: karancode/kustomize-github-action@master
        with:
          kustomize_version: '3.0.0'
          kustomize_build_dir: 'catalog-service/k8s/base'
  package:
    name: Package and Publish
    if: ${{github.ref == 'refs/heads/main'}}
    needs:
      - build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Build container image
        run:
          |
          cd catalog-service
          chmod +x ./gradlew
          ./gradlew bootJar
          docker build -t ${{env.REGISTRY}}/${{env.IMAGE_NAME}}:${{env.VERSION}} .
      - name:  OCI image vulnerability scanning
        uses: anchore/scan-action@v6
        id: scan
        with:
          image: ${{env.REGISTRY}}/${{env.IMAGE_NAME}}:${{env.VERSION}}
          fail-build: false
          severity-cutoff: 'high'
          output-file: "${{ github.event.repository.name }}-image-vulnerability-report.json"
      - name: Upload vulnerability report
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
      - name: Log into container registry
        uses: docker/login-action@v3
        with:
          registry: ${{env.REGISTRY}}
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Publish container image
        run:
          |
          docker push ${{env.REGISTRY}}/${{env.IMAGE_NAME}}:${{env.VERSION}}
