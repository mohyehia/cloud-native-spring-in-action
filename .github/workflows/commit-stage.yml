name: Commit Stage
on:
  push:
    branches:
      - main
    paths:
      - catalog-service/**
      - .github/workflows/*.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mohyehia/catalog-service
  VERSION: latest

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Code vulnerability scanning
        uses: anchore/scan-action@v6
        id: scan
        with:
          path: "./catalog-service"
          fail-build: false
          severity-cutoff: 'high'
          output-file: "${{ github.event.repository.name }}-vulnerability-report.json"
      - name:  Upload vulnerability report
        uses:  github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
      - name:  Build, unit tests and integration tests
        run:
          |
          cd catalog-service
          chmod +x ./gradlew
          ./gradlew build
  package:
    name: Package and Publish
    if: ${{github.ref == 'refs/heads/main'}}
    needs:
      - build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Build container image
        run:
          |
          cd catalog-service
          chmod +x ./gradlew
          ./gradlew bootJar
          docker build -t ${{env.REGISTRY}}/${{env.IMAGE_NAME}}:${{env.VERSION}} catalog-service/.
