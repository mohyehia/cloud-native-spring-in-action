global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'catalog-service'
    scrape_interval: 5s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'catalog-service:9091' ]

  - job_name: 'api-gateway'
    scrape_interval: 5s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'api-gateway:9001' ]

  - job_name: 'order-service'
    scrape_interval: 5s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'order-service:9092' ]

  - job_name: 'dispatcher-service'
    scrape_interval: 5s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'dispatcher-service:9003' ]

  - job_name: 'tempo'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: [ 'localhost:3200' ]

  - job_name: 'loki'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: [ 'localhost:3100' ]

  - job_name: 'otel-collector'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: [ 'localhost:8888' ]